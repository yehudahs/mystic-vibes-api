/tmp/vibely-ai-service.log
/tmp/vibely-backend.log
/tmp/vibely-frontend.log
/tmp/vibely-ollama.log
/tmp/vibely-cloudflared.log
{
    size 50M        # rotate when file hits 50MB
    rotate 3        # keep 3 old copies
    compress        # gzip old logs
    missingok       # don't error if log file missing
    notifempty      # don't rotate empty files
    copytruncate    # copy then truncate in place (safe for open file descriptors)
}
